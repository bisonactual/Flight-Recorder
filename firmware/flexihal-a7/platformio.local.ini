; Flight recorder variants of Expatria's PrintNC builds. build.sh copies this into the
; driver, and their platformio.ini loads it. Each variant extends one of Expatria's
; environments (board, linker script, options, UF2 output) and only adds
;   - the recorder plugin (lib flight_recorder) and FLIGHT_RECORDER_ENABLE=1
;   - EEPROM_IS_FRAM=1, for the FM24V10 FRAM fitted at U27 that holds the settings
;   - MPG_ENABLE=0, since MPG stays off with the FRAM whatever the parent build says
; The _fr_wd variants also have the hardware watchdog (FR_WATCHDOG_ENABLE, setting $793).
; The UF2 label is the build's name, because two of Expatria's own labels are the same.

[flight_recorder]
build_flags =
  -D FLIGHT_RECORDER_ENABLE=1
  -D EEPROM_IS_FRAM=1
  -D MPG_ENABLE=0

[env:f446re_flexi_cnc_printnc_eth_sd_fr]
extends = env:f446re_flexi_cnc_printnc_eth_sd
custom_prog_version = PRINTNC_ETH_SD_FR
build_flags = ${env:f446re_flexi_cnc_printnc_eth_sd.build_flags}
  ${flight_recorder.build_flags}
lib_deps = ${env:f446re_flexi_cnc_printnc_eth_sd.lib_deps}
  flight_recorder

[env:f446re_flexi_cnc_printnc_eth_sd_fr_wd]
extends = env:f446re_flexi_cnc_printnc_eth_sd
custom_prog_version = PRINTNC_ETH_SD_FR_WD
build_flags = ${env:f446re_flexi_cnc_printnc_eth_sd.build_flags}
  ${flight_recorder.build_flags}
  -D FR_WATCHDOG_ENABLE=1
lib_deps = ${env:f446re_flexi_cnc_printnc_eth_sd.lib_deps}
  flight_recorder

[env:f446re_flexi_cnc_printnc_eth_sd_4x_fr]
extends = env:f446re_flexi_cnc_printnc_eth_sd_4x
custom_prog_version = PRINTNC_ETH_SD_4X_FR
build_flags = ${env:f446re_flexi_cnc_printnc_eth_sd_4x.build_flags}
  ${flight_recorder.build_flags}
lib_deps = ${env:f446re_flexi_cnc_printnc_eth_sd_4x.lib_deps}
  flight_recorder

[env:f446re_flexi_cnc_printnc_eth_sd_4x_fr_wd]
extends = env:f446re_flexi_cnc_printnc_eth_sd_4x
custom_prog_version = PRINTNC_ETH_SD_4X_FR_WD
build_flags = ${env:f446re_flexi_cnc_printnc_eth_sd_4x.build_flags}
  ${flight_recorder.build_flags}
  -D FR_WATCHDOG_ENABLE=1
lib_deps = ${env:f446re_flexi_cnc_printnc_eth_sd_4x.lib_deps}
  flight_recorder

[env:f446re_flexi_cnc_printnc_fr]
extends = env:f446re_flexi_cnc_printnc
custom_prog_version = PRINTNC_FR
build_flags = ${env:f446re_flexi_cnc_printnc.build_flags}
  ${flight_recorder.build_flags}
lib_deps = ${env:f446re_flexi_cnc_printnc.lib_deps}
  flight_recorder

[env:f446re_flexi_cnc_printnc_fr_wd]
extends = env:f446re_flexi_cnc_printnc
custom_prog_version = PRINTNC_FR_WD
build_flags = ${env:f446re_flexi_cnc_printnc.build_flags}
  ${flight_recorder.build_flags}
  -D FR_WATCHDOG_ENABLE=1
lib_deps = ${env:f446re_flexi_cnc_printnc.lib_deps}
  flight_recorder
